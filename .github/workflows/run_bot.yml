name: githubBTC Bot

on:
  schedule:
    - cron: '2 0,6,12,18 * * *'
  workflow_dispatch:      # 支持手动触发测试

jobs:
  run-trading-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5     # 限制最大运行时间防止卡死消耗额度

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 强制安装指定依赖
        run: |
          python -m pip install --upgrade pip
          # 直接在此处指定安装官方库（使用最新的 okx 库）
          pip install pandas numpy python-okx

      - name: 运行交易脚本
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
        run: |
          python githubBTC.py

      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-logs
          path: spot_trading_bot.log
