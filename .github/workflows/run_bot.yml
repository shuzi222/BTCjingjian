name: githubBTC Bot

on:
  schedule:
    # ⚠️ 关键点：GitHub Actions 的时区是 UTC (世界协调时)
    # 北京时间晚上 8 点 (20:00) 对应 UTC 时间中午 12 点 (12:00)
    - cron: "0 12 * * *"
  workflow_dispatch: # 允许你在 GitHub 页面上手动点击运行（方便测试）

jobs:
  run-crypto-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装第三方依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行交易脚本
        env:
          # 将 GitHub Secrets 中的安全密钥注入到系统环境变量中
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
        run: python githubBTC.py
